name: Build SYREX LAB v1.1 Desktop EXE

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Get the repository source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install app and packager dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Download Windows FFmpeg
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg-win64.zip"
          $expanded = Join-Path $env:RUNNER_TEMP "ffmpeg-win64"
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $expanded -Force
          $ffmpeg = Get-ChildItem -Path $expanded -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          if (-not $ffmpeg) { throw "Could not find ffmpeg.exe in the downloaded archive." }
          Copy-Item $ffmpeg.FullName (Join-Path $env:GITHUB_WORKSPACE "ffmpeg.exe") -Force
          & (Join-Path $env:GITHUB_WORKSPACE "ffmpeg.exe") -version | Select-Object -First 3 | Set-Content (Join-Path $env:GITHUB_WORKSPACE "FFMPEG-BUILD-INFO.txt")

      - name: Build single-file desktop app (no console)
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SYREX_LAB_v1.1 `
            --collect-all flask `
            --collect-all jinja2 `
            --collect-all webview `
            --collect-all clr_loader `
            --collect-all pythonnet `
            --hidden-import webview.platforms.edgechromium `
            --hidden-import clr_loader `
            --hidden-import pythonnet `
            --add-data "templates;templates" `
            --add-data "static;static" `
            --add-binary "ffmpeg.exe;." `
            desktop_launcher.py
          if (-not (Test-Path "dist/SYREX_LAB_v1.1.exe")) { throw "PyInstaller did not create the desktop executable." }

      - name: Prepare one-click download ZIP
        shell: pwsh
        run: |
          Copy-Item "FFMPEG-LICENSE-INFO.txt" "dist/FFMPEG-LICENSE-INFO.txt" -Force
          Copy-Item "FFMPEG-BUILD-INFO.txt" "dist/FFMPEG-BUILD-INFO.txt" -Force
          Set-Content -Path "dist/README-FIRST.txt" -Value @(
            "SYREX LAB v1.1 Desktop",
            "",
            "Double-click SYREX_LAB_v1.1.exe. No CMD window or external browser should open.",
            "The existing app interface is displayed inside the desktop window.",
            "Windows 10/11 with Microsoft Edge WebView2 Runtime is required.",
            "Keep this license/build information with the executable when redistributing."
          )
          Compress-Archive -Path "dist/SYREX_LAB_v1.1.exe","dist/FFMPEG-LICENSE-INFO.txt","dist/FFMPEG-BUILD-INFO.txt","dist/README-FIRST.txt" -DestinationPath "dist/SYREX_LAB_v1.1-Desktop-Windows.zip" -Force

      - name: Upload Windows desktop app
        uses: actions/upload-artifact@v4
        with:
          name: SYREX-LAB-v1.1-Desktop-Windows
          path: dist/SYREX_LAB_v1.1-Desktop-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish a GitHub Release when a version tag is pushed
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view "$tag" --json tagName --jq .tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$tag" "dist/SYREX_LAB_v1.1-Desktop-Windows.zip" --clobber
          } else {
            gh release create "$tag" "dist/SYREX_LAB_v1.1-Desktop-Windows.zip" `
              --title "SYREX LAB $tag" `
              --notes "Windows x64 desktop build. Extract the ZIP and double-click SYREX_LAB_v1.1.exe. The app opens its interface in an embedded desktop window without a console window or external browser. Microsoft Edge WebView2 Runtime is required. Review the included FFmpeg license and build information."
          }
