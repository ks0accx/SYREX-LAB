name: Build SYREX LAB for Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Get the repository source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install app and packager dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Download FFmpeg for Windows
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg-win64.zip"
          $expanded = Join-Path $env:RUNNER_TEMP "ffmpeg-win64"
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $expanded -Force
          $ffmpeg = Get-ChildItem -Path $expanded -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          if (-not $ffmpeg) { throw "Could not find ffmpeg.exe in the downloaded archive." }
          Copy-Item $ffmpeg.FullName (Join-Path $env:GITHUB_WORKSPACE "ffmpeg.exe") -Force
          & (Join-Path $env:GITHUB_WORKSPACE "ffmpeg.exe") -version | Select-Object -First 3 | Set-Content (Join-Path $env:GITHUB_WORKSPACE "FFMPEG-BUILD-INFO.txt")

      - name: Build the Windows app
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name SYREX_LAB `
            --collect-all flask `
            --collect-all jinja2 `
            --add-data "templates;templates" `
            --add-data "static;static" `
            server.py
          if (-not (Test-Path "dist/SYREX_LAB.exe")) { throw "PyInstaller did not create the app executable." }
          Copy-Item "ffmpeg.exe" "dist/ffmpeg.exe" -Force
          Copy-Item "FFMPEG-LICENSE-INFO.txt" "dist/FFMPEG-LICENSE-INFO.txt" -Force
          Copy-Item "FFMPEG-BUILD-INFO.txt" "dist/FFMPEG-BUILD-INFO.txt" -Force
          Compress-Archive -Path "dist/SYREX_LAB.exe","dist/ffmpeg.exe","dist/FFMPEG-LICENSE-INFO.txt","dist/FFMPEG-BUILD-INFO.txt" -DestinationPath "dist/SYREX_LAB-Windows.zip" -Force

      - name: Save the build as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: SYREX-LAB-Windows
          path: dist/SYREX_LAB-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish a GitHub Release when a version tag is pushed
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view "$tag" --json tagName --jq .tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$tag" "dist/SYREX_LAB-Windows.zip" --clobber
          } else {
            gh release create "$tag" "dist/SYREX_LAB-Windows.zip" `
              --title "SYREX LAB $tag" `
              --notes "Windows x64 build. Extract the ZIP and keep SYREX_LAB.exe and ffmpeg.exe in the same folder. The local web UI opens in your browser. See the FFmpeg license and build-info files in the ZIP."
          }
